<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>What stays on your Mac: recordings, transcripts, voices and notes. Claude gets transcript text only; the calendar is read-only.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#7A7A7A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="880" height="300" rx="18" fill="#292929"/>

  <rect x="20" y="20" width="560" height="260" rx="14" fill="#333333" stroke="#4DCC73" stroke-opacity="0.45"/>
  <g transform="translate(44 40)" fill="none" stroke="#4DCC73" stroke-width="1.6" stroke-linejoin="round">
    <rect x="0" y="0" width="26" height="17" rx="2.5"/><path d="M-3 21 H29" stroke-linecap="round"/>
  </g>
  <text x="84" y="54" font-size="16" font-weight="600" fill="#EDEDED">Stays on your Mac</text>
  <text x="84" y="76" font-size="12.5" fill="#A0A0A0">Nothing here is uploaded anywhere</text>

  <g font-size="13.5" fill="#EDEDED">
    <rect x="44" y="100" width="248" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.07"/>
    <circle cx="66" cy="122" r="4" fill="#4DCC73"/><text x="80" y="127">Call and mic recordings</text>
    <rect x="308" y="100" width="248" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.07"/>
    <circle cx="330" cy="122" r="4" fill="#4DCC73"/><text x="344" y="127">Full transcripts</text>
    <rect x="44" y="156" width="248" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.07"/>
    <circle cx="66" cy="178" r="4" fill="#4DCC73"/><text x="80" y="183">Voice fingerprints</text>
    <rect x="308" y="156" width="248" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.07"/>
    <circle cx="330" cy="178" r="4" fill="#4DCC73"/><text x="344" y="183">Notes in your Obsidian vault</text>
    <rect x="44" y="212" width="248" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.07"/>
    <circle cx="66" cy="234" r="4" fill="#4DCC73"/><text x="80" y="239">Slide screenshots</text>
    <rect x="308" y="212" width="248" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.07"/>
    <circle cx="330" cy="234" r="4" fill="#4DCC73"/><text x="344" y="239">Speech-to-text, run locally</text>
  </g>

  <rect x="636" y="20" width="224" height="118" rx="14" fill="#333333" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="656" y="54" font-size="15" font-weight="600" fill="#EDEDED">Claude</text>
  <text x="656" y="76" font-size="12.5" fill="#A0A0A0">On your own subscription.</text>
  <text x="656" y="96" font-size="12.5" fill="#A0A0A0">Gets the transcript text</text>
  <text x="656" y="116" font-size="12.5" fill="#A0A0A0">only, to write Expanded.</text>

  <rect x="636" y="162" width="224" height="118" rx="14" fill="#333333" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="656" y="196" font-size="15" font-weight="600" fill="#EDEDED">Your calendar</text>
  <text x="656" y="218" font-size="12.5" fill="#A0A0A0">Google or Microsoft.</text>
  <text x="656" y="238" font-size="12.5" fill="#A0A0A0">Read-only: lists what's</text>
  <text x="656" y="258" font-size="12.5" fill="#A0A0A0">coming up. Never changed.</text>

  <g stroke="#7A7A7A" stroke-width="1.6" fill="none">
    <line x1="584" y1="79" x2="632" y2="79" marker-end="url(#arrow)"/>
    <line x1="632" y1="221" x2="584" y2="221" marker-end="url(#arrow)"/>
  </g>
</svg>
